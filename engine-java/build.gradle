// engine-java: OpenRocket physics kernel (carved, unmodified) + shims,
// compiled to JS/WASM via TeaVM and validated bit-identical against the JVM.
plugins {
    id 'java'
    id 'org.teavm' version '0.15.0'   // >= 0.15 REQUIRED: 0.10's JS backend inverts NaN comparisons
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir 'src/carved/java'   // verbatim OpenRocket sources (see carve-manifest.txt)
            srcDir 'src/shims/java'    // our replacements for JVM-only surface
            srcDir 'src/harness/java'  // golden-scenario harness (runs on JVM and TeaVM)
        }
    }
    // java.awt.geom stand-ins for TeaVM (its classlib has no java.awt).
    // Compiled separately with --patch-module (JPMS forbids java.* in the
    // unnamed module). On the JVM the real JDK classes win via parent
    // delegation, so these affect the TeaVM transpile only.
    awtStubs {
        java {
            srcDir 'src/awtstubs/java'
        }
    }
}

compileAwtStubsJava {
    options.compilerArgs += ['--patch-module', "java.desktop=${file('src/awtstubs/java')}"]
}

// Make the stub classes visible to TeaVM's transpiler (it reads bytecode
// from the runtime classpath; package names are all that matter to it).
dependencies {
    implementation files(sourceSets.awtStubs.output.classesDirs) {
        builtBy 'compileAwtStubsJava'
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:1.7.36'
    // TeaVM-safe slf4j substitution (real slf4j's binding discovery breaks under TeaVM).
    implementation 'org.teavm:teavm-extras-slf4j:0.15.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

teavm.js {
    mainClass = 'harness.GoldenMain'
    obfuscated = false
    // TeaVM's devirtualizer miscompiles the kernel: at FlightConfiguration's
    // tree walk it inlined RocketComponent.getInstanceCount()'s `return 1`,
    // ignoring FinSet's override (fin contexts collapsed 3→1, masses zeroed),
    // and pruned virtual methods reached only via map-key dispatch.
    optimization = org.teavm.gradle.api.OptimizationLevel.NONE
    // Class-hierarchy-based analysis: TeaVM's precise flow analysis under-links
    // virtual-method impls in this codebase (methods reached via map-key or
    // recursive-walk dispatch got pruned; see docs/phase0-findings.md P1.2 notes).
    fastGlobalAnalysis = true
    // NOTE: strict = true is NOT usable — it breaks util.ArrayList.clone with
    // ClassCastException. JS Math transcendentals (pow/log) differ from Java's
    // by 1-2 ULPs; difftest.mjs allows 1e-13 relative tolerance for that.
}

teavm.wasmGC {
    mainClass = 'harness.GoldenMain'
}

// Run the golden harness on the JVM (reference output).
tasks.register('goldenJvm', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'harness.GoldenMain'
}
