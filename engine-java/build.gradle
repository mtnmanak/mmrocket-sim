// engine-java: OpenRocket physics kernel (carved, unmodified) + shims,
// compiled to JS/WASM via TeaVM and validated bit-identical against the JVM.
plugins {
    id 'java'
    id 'org.teavm' version '0.15.0'   // >= 0.15 REQUIRED: 0.10's JS backend inverts NaN comparisons
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir 'src/carved/java'   // verbatim OpenRocket sources (see carve-manifest.txt)
            srcDir 'src/shims/java'    // our replacements for JVM-only surface
            srcDir 'src/harness/java'  // golden-scenario harness (runs on JVM and TeaVM)
            srcDir 'src/api/java'      // @JSExport facade consumed by @online-openrocket/engine
        }
    }
    // java.awt.geom stand-ins for TeaVM (its classlib has no java.awt).
    // Compiled separately with --patch-module (JPMS forbids java.* in the
    // unnamed module). On the JVM the real JDK classes win via parent
    // delegation, so these affect the TeaVM transpile only.
    awtStubs {
        java {
            srcDir 'src/awtstubs/java'
        }
    }
}

compileAwtStubsJava {
    // Files are assigned to the patched module owning their package
    // (java.awt.geom -> java.desktop, java.text -> java.base).
    options.compilerArgs += ['--patch-module', "java.desktop=${file('src/awtstubs/java')}"]
    options.compilerArgs += ['--patch-module', "java.base=${file('src/awtstubs/java')}"]
}

// Make the stub classes visible to TeaVM's transpiler (it reads bytecode
// from the runtime classpath; package names are all that matter to it).
dependencies {
    implementation files(sourceSets.awtStubs.output.classesDirs) {
        builtBy 'compileAwtStubsJava'
    }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:1.7.36'
    // TeaVM-safe slf4j substitution (real slf4j's binding discovery breaks under TeaVM).
    implementation 'org.teavm:teavm-extras-slf4j:0.15.0'
    // @JSExport / JS interop annotations for the API facade.
    implementation 'org.teavm:teavm-jso:0.15.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

teavm.js {
    mainClass = 'api.OrkEngine'
    obfuscated = false
    // Native ES module: real named exports. UMD's dynamically-assigned
    // exports are invisible to rollup-commonjs static analysis — the whole
    // engine got tree-shaken out of production bundles (blank page).
    moduleType = org.teavm.gradle.api.JSModuleType.ES2015
    // TeaVM's devirtualizer miscompiles the kernel: at FlightConfiguration's
    // tree walk it inlined RocketComponent.getInstanceCount()'s `return 1`,
    // ignoring FinSet's override (fin contexts collapsed 3→1, masses zeroed),
    // and pruned virtual methods reached only via map-key dispatch.
    //
    // NOTE (measured 2026-08-26): this line is REDUNDANT — see fastGlobalAnalysis
    // below, which forces SIMPLE regardless. Builds at NONE, BALANCED and
    // AGGRESSIVE are byte-identical. Kept because it states the intent, but do
    // not expect changing it to do anything.
    optimization = org.teavm.gradle.api.OptimizationLevel.NONE
    // Class-hierarchy-based analysis: TeaVM's precise flow analysis under-links
    // virtual-method impls in this codebase (methods reached via map-key or
    // recursive-walk dispatch got pruned).
    //
    // STILL REQUIRED on TeaVM 0.15 — re-tested 2026-08-26, both ways: with this
    // off the build fails at runtime with `$c.$getFinCount is not a function`
    // (AGGRESSIVE) and `$component.$getRotationalUnitInertia is not a function`
    // (NONE). Failing at BOTH optimization levels is what proves it is the
    // dependency ANALYZER under-linking, not the optimizer devirtualizing.
    //
    // THE PRICE, so nobody re-litigates it blind: TeaVMTool does
    //   vm.setOptimizationLevel((fastDependencyAnalysis || incremental)
    //       ? TeaVMOptimizationLevel.SIMPLE : optimizationLevel);
    // so this flag also switches off ALL of TeaVM's optimization — no inlining,
    // no scalar replacement, no loop-invariant motion. Measured cost against the
    // same kernel on the JVM: 11–16× slower. That is why the kernel carries
    // hand-written memoization patches (LEDGER "Performance patches"); they do
    // by hand what this flag forbids the compiler from doing.
    fastGlobalAnalysis = true
    // NOTE: strict = true is NOT usable — it breaks util.ArrayList.clone with
    // ClassCastException. JS Math transcendentals (pow/log) differ from Java's
    // by 1-2 ULPs; difftest.mjs allows 1e-13 relative tolerance for that.
}

teavm.wasmGC {
    mainClass = 'api.OrkEngine'
}

// Run the golden harness on the JVM (reference output).
tasks.register('goldenJvm', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'api.OrkEngine'
}
