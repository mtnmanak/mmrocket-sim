# Build and publish to the online-open-rocket Cloudflare Pages project.
#
# Why Actions rather than Cloudflare's own Git integration: the Pages project was
# created by `wrangler pages deploy` (Direct Upload), and Cloudflare does not let a
# Direct Upload project be converted to a Git-connected one. So the project stays as
# it is and CI drives the same deploy command a human would run.
#
# `npm run build` is the user-guide generator, then tsc + vite — the TeaVM-compiled
# engine kernel is the committed artifact packages/engine/vendor/orkengine.mjs, so no
# Java toolchain is needed here. version.json is copied into dist the same way
# scripts/package-dist.mjs does for release zips: the main site's Online Tools page
# reads it for the version badge.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account id (also shown by `npx wrangler whoami`)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a Pages deploy replaces the live build wholesale.
concurrency:
  group: deploy-online-open-rocket
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A push IS a release here, so the release checklist's version pairing is
      # enforced where it matters: fail the deploy when version.json and
      # APP_VERSION drift (the failure mode that once let this repo sit 22
      # releases ahead of what the live badge reported). Same regex as
      # scripts/package-dist.mjs.
      - name: version.json must match APP_VERSION
        run: |
          node -e "
            const { readFileSync } = require('node:fs');
            const app = readFileSync('packages/app/src/version.ts', 'utf8')
              .match(/APP_VERSION\s*=\s*'([^']+)'/)?.[1];
            const json = JSON.parse(readFileSync('version.json', 'utf8')).version;
            if (!app || app !== json) {
              console.error('version.json says ' + json + ' but APP_VERSION is ' + app
                + ' — update both together (release checklist in packages/app/src/version.ts).');
              process.exit(1);
            }
            console.log('version ' + app + ' is consistent');
          "

      - run: npm ci

      # Typecheck BEFORE the tests, and this order is the whole point of the step.
      # `tsc -b` already ran inside `npm run build` further down, so a type error
      # could never reach production — but it reached it LATE, after ~2 minutes of
      # npm ci plus the full engine+app suite, and by then main is red with a
      # version.json already bumped for a release that never shipped (the shape of
      # commit 3efcf38, "fix: the v0.098 deploy-gate failure"). Worse, `npm test`
      # is what a developer runs locally before pushing, and vitest transpiles
      # without checking types — so a green local test run was never evidence of a
      # green build. `npm run typecheck` is that missing local signal, and putting
      # it first here is the same fail-fast reasoning as the version-pairing step
      # above. It builds the engine package because the app typechecks against the
      # engine's emitted dist/index.d.ts.
      - run: npm run typecheck

      # ESLint. The rule set is deliberately small (see eslint.config.mjs for what
      # was measured and what was left out); its core value is react-hooks, whose
      # eight suppression comments in the source sat inert for months because no
      # linter was installed to honour them. Warnings do not fail the job — only
      # errors do.
      - run: npm run lint

      # A push IS a release here, so the suite that guards the physics and the
      # file formats runs BEFORE anything reaches the live beta. `npm test`
      # builds the engine package first (its dist is a build output, not
      # committed), which also makes this the fresh-clone smoke test.
      - run: npm test

      - run: npm run build

      - run: cp version.json packages/app/dist/

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # --branch is explicit because checkout leaves a detached HEAD, and
          # without it the deploy would not be marked production.
          command: pages deploy packages/app/dist --project-name=online-open-rocket --branch=main
