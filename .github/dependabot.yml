# Dependency update PRs (audit 2026-09-22). Nothing kept dependencies current:
# @types/three had drifted 16 releases past the three.js the app runs, and the
# dev toolchain carried 12 advisories behind major upgrades nobody scheduled
# (cleared by the vite 5 -> 8 and vitest 2 -> 5 upgrade, AUDIT row 528:
# `npm audit` reported 0 after it).
#
# QUIET BY DESIGN — this is a public repo and one person reviews it:
#   - MONTHLY, and GROUPED: one PR per ecosystem per month, never one per package.
#   - No semver-MAJOR bumps. A major (vite 8 -> 9, vitest 5 -> 6, React 18 -> 19)
#     is a planned upgrade with its own sitting, not a line in a monthly batch —
#     and one unmergeable major would hold every patch in the group hostage. So
#     an advisory whose fix is a major will not arrive here by itself, and
#     nothing else raises one yet: no workflow runs `npm audit`, and this repo's
#     Dependabot alerts were off when the 12 above were cleared (2026-09-23).
#     Until that is decided, `npm audit` run by hand is the only way to see one.
#   - three.js is 0.x and its MINOR is its major (0.169 -> 0.185 removes API), so
#     three and @types/three take no minor bumps either. They move together, by
#     hand; package.json's `overrides` and
#     packages/app/scripts/dependencies.threeTypes.test.mjs hold them in step.
#   - labels: [] — Dependabot would otherwise create and apply its own labels in
#     this repo.
#
# WHAT A PR HERE GETS: deploy.yml's build job, the full gate (version pairing,
# npm ci, typecheck, lint at zero warnings, the tests, the build) run on the PR
# merged into main, as a check on the PR; it deploys nothing (audit
# 2026-09-30, which found Dependabot PRs going unchecked until merged).
# What the check does NOT do: `npm audit`, or read the lockfile diff — the
# policy below still does both by hand — and no rule makes a merge wait for
# it. Merging IS the deploy, whose build job runs the gate again and refuses
# to publish on any failure.
#
# THE POLICY (the owner's ruling, 2026-09-24): these PRs are ROUTINE. Check the
# branch out, run the full gate under Node 22 as CI does — `npm ci && npm run
# typecheck && npm run lint -- --max-warnings 0 && npm test && npm run build`,
# then `npm audit` (the deploy gate fails on ANY lint warning; bare `npm run
# lint` does not) — read the lockfile diff for added packages and install
# scripts, merge if green, and report it. PR #2 (eslint, typescript-eslint,
# happy-dom) was the first, merged 2026-09-24 as a fast-forward.
#
# ONE EXPECTED RED (2026-10-01). The XML-parser parity test
# (packages/app/src/services/xmlParse.hostile.test.ts) holds saxes,
# @xmldom/xmldom and css-select — the parser a server will ship — to a NAMED
# list of the rows where they answer differently from Chrome, and fails when a
# bump moves any row, on purpose. Read the row the failure names, then update
# the list or hold the package back; it is not a flake. happy-dom's own list
# is a subset check and stays green when happy-dom gets closer to Chrome.
#
# The wrangler version in deploy.yml (`wranglerVersion` and the install step)
# is not something Dependabot reads: bump those two together, by hand.

version: 2
updates:
  - package-ecosystem: npm
    # The workspace root: its package-lock.json covers packages/app and
    # packages/engine.
    directory: /
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: three
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    # Reads .github/workflows/*.yml. Every action there is pinned to a commit SHA
    # with its tag in a trailing comment; Dependabot updates both.
    directory: /
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
