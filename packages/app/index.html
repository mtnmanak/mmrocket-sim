<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Canonical-host redirect, BEFORE the app (or its service worker)
      // loads: the pages.dev origin still answers — it is the deploy target —
      // but the address testers bookmark and share must be the subdomain
      // (it is the only address handed out). EXACT hostname match
      // on purpose: branch previews live at <hash>.online-open-rocket
      // .pages.dev and must keep working un-redirected. path+search+HASH all
      // carry over — share links put the whole design in the fragment.
      if (location.hostname === 'online-open-rocket.pages.dev') {
        location.replace('https://mmrsim.mountainmanrockets.com'
          + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Design, simulate, fly — OpenRocket-derived physics, validated to Mach 4.6 against NASA wind-tunnel data. In your browser, offline-capable." />
    <meta name="theme-color" content="#111110" />
    <script>
      // Paint the page ground BEFORE React mounts. The theme lives in
      // .viz-root tokens, which don't exist until the app renders — without
      // this, every load of the (default-dark) app opens on browser-white
      // and flips dark a beat later. Reads the same pref blob PrefsContext
      // owns; any failure falls through to dark, the app default. Values
      // MUST match --surface-0 in styles.css (light #f4f2ee / dark #111110).
      // Daylight forces a WHITE page whatever the theme (the data-contrast
      // block in styles.css) — it must be read too, or the phone-in-sunlight
      // users the mode serves get the flash inverted (dark pre-paint, then
      // white on mount). App.tsx re-writes both the ground and the meta on
      // every live theme/daylight change; this script only covers the load.
      (function () {
        var theme = 'dark';
        var daylight = false;
        try {
          var p = JSON.parse(localStorage.getItem('online-openrocket.prefs.v1') || '{}');
          daylight = !!p.daylight;
          var t = p.themeExplicit ? p.theme : 'dark';
          theme = t === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (t === 'light' ? 'light' : 'dark');
        } catch (e) { /* default dark, daylight off */ }
        var bg = daylight ? '#ffffff' : theme === 'light' ? '#f4f2ee' : '#111110';
        document.documentElement.style.background = bg;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bg);
      })();
    </script>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>MMRocket Sim — Rocket Design & Flight Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
