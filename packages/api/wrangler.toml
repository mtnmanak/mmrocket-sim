name = "mmrsim-api"
main = "src/index.ts"
compatibility_date = "2026-09-28"
send_metrics = false
minify = true

[dev]
ip = "127.0.0.1"
port = 8787


# Paid Workers only; local workerd does not enforce this CPU ceiling. 60 s: the heaviest corpus
# design measured ~25 s of CPU in Node (2026-10-22) against the 30 s default; the maximum is 300 s.
[limits]
cpu_ms = 60000
