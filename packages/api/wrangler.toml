name = "mmrsim-api"
main = "src/index.ts"
compatibility_date = "2026-09-28"
send_metrics = false
minify = true

[dev]
ip = "127.0.0.1"
port = 8787


# Deployed 2026-10-23: the heaviest corpus design took 47-56 s warm and was killed at 60 s
# on cold isolates. Paid Workers' maximum is 300 s; local workerd does not enforce it.
[limits]
cpu_ms = 300000
