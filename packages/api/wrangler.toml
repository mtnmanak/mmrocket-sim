name = "mmrsim-api"
main = "src/index.ts"
compatibility_date = "2026-09-28"
send_metrics = false
minify = true
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.mmrsim.mountainmanrockets.com", custom_domain = true }]

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[dev]
ip = "127.0.0.1"
port = 8787


# Raised to 300 s on 2026-10-24 after cold-isolate CPU P999 about 124 s (47-56 s warm).
# Deploy B: 129/129 corpus responses, 0 kills; 503 KERNEL_UNAVAILABLE verified on Cloudflare.
# The budget gives about 2.4x the measured P999. Local workerd does not enforce it.
[limits]
cpu_ms = 300000
